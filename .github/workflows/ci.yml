name: CI ISUR

on:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v7

      - name: Construir imagen Docker
        run: docker build -t mi-app .

      - name: Ejecutar contenedor
        run: docker run -d -p 8080:80 mi-app